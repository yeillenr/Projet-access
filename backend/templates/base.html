<!DOCTYPE html>
<html lang="fr" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>{% block title %}Accueil{% endblock %} · Cabinet médical</title>
    {% include "partials/styles.html" %}
    <style>
        /* Masque la page tant que la session n'est pas vérifiée (évite un flash avant redirection). */
        .auth-pending .app, .auth-pending .tabbar { visibility: hidden; }

        .app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100dvh; }

        /* Menu latéral (ordinateur) */
        .sidebar {
            position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; gap: 6px;
            padding: 20px 14px; background: var(--surface); border-right: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; text-decoration: none; color: var(--text); }
        .brand-mark { width: 36px; height: 36px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: var(--on-primary); }
        .brand-name { font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
        .brand-sub { font-size: .75rem; color: var(--muted); }
        .side-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
            color: var(--muted); text-decoration: none; font-weight: 600; transition: background .12s ease, color .12s ease;
        }
        .nav-link:hover { background: var(--hover); color: var(--text); }
        .nav-link[aria-current="page"] { background: var(--primary-soft); color: var(--primary); }
        .side-foot { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
        .user-card { display: flex; align-items: center; gap: 10px; padding: 6px 8px; min-width: 0; }
        .user-meta { display: flex; flex-direction: column; min-width: 0; }
        .user-name { font-weight: 700; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .user-role { font-size: .78rem; color: var(--muted); }

        /* Barre du haut (mobile / tablette) */
        .topbar {
            display: none; position: sticky; top: 0; z-index: 20; align-items: center; justify-content: space-between; gap: 12px;
            padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
            background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        .topbar .brand { padding: 0; }
        .user-menu { position: relative; }
        .user-menu summary { list-style: none; cursor: pointer; border-radius: 50%; }
        .user-menu summary::-webkit-details-marker { display: none; }
        .user-menu .menu {
            position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; padding: 8px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg);
        }
        .menu .user-card { padding: 8px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
        .menu-item { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px; border: 0; background: none; border-radius: 9px; color: var(--text); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
        .menu-item:hover { background: var(--hover); }

        .main { padding: clamp(16px, 3vw, 32px); max-width: 1280px; width: 100%; margin: 0 auto; }

        /* Onglets du bas (mobile) */
        .tabbar {
            display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
            grid-template-columns: repeat(var(--tabs, 4), 1fr);
            padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
            background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
        }
        .tab-link { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border-radius: 10px; color: var(--muted); text-decoration: none; font-size: .72rem; font-weight: 700; }
        .tab-link[aria-current="page"] { color: var(--primary); }
        .tab-link[aria-current="page"] svg { background: var(--primary-soft); border-radius: 999px; padding: 2px 10px; width: 46px; box-sizing: content-box; }

        @media (max-width: 1023px) {
            .app { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .topbar { display: flex; }
            .tabbar { display: grid; }
            .main { padding-bottom: calc(var(--tabbar) + 28px + env(safe-area-inset-bottom, 0px)); }
        }
        {% block extra_style %}{% endblock %}
    </style>
</head>
<body data-page="{% block page %}{% endblock %}" data-roles="{% block roles %}ADMIN,MEDECIN,SECRETAIRE{% endblock %}">
    <div class="app">
        <aside class="sidebar" aria-label="Menu principal">
            <a class="brand" href="/">
                <span class="brand-mark"><i data-icon="heart"></i></span>
                <span><span class="brand-name">Cabinet médical</span><br><span class="brand-sub">Gestion du cabinet</span></span>
            </a>
            <nav class="side-nav" id="sideNav"></nav>
            <div class="side-foot">
                <div class="user-card" data-user></div>
                <button class="nav-link" type="button" data-logout style="border:0;background:none;font:inherit;font-weight:600;cursor:pointer;width:100%">
                    <i data-icon="logout"></i><span>Se déconnecter</span>
                </button>
            </div>
        </aside>

        <div>
            <header class="topbar">
                <a class="brand" href="/">
                    <span class="brand-mark"><i data-icon="heart" data-size="18"></i></span>
                    <span class="brand-name">Cabinet médical</span>
                </a>
                <details class="user-menu">
                    <summary aria-label="Mon compte"><span class="avatar" id="topAvatar"></span></summary>
                    <div class="menu">
                        <div class="user-card" data-user></div>
                        <button class="menu-item" type="button" data-logout><i data-icon="logout" data-size="18"></i>Se déconnecter</button>
                    </div>
                </details>
            </header>

            <main class="main" id="main">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <nav class="tabbar" id="tabbar" aria-label="Navigation"></nav>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    {% include "partials/core_js.html" %}
    <script>
        hydrateIcons();
        if (App.guard()) {
            document.getElementById('topAvatar').textContent = App.initials(App.session.name());
            // Ferme le menu compte quand on clique ailleurs.
            document.addEventListener('click', e => {
                const menu = document.querySelector('.user-menu');
                if (menu && menu.open && !menu.contains(e.target)) menu.open = false;
            });
            {% block script %}{% endblock %}
        }
    </script>
</body>
</html>
