<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    /* ---------- Thème ---------- */
    :root {
        --bg: #f4f6f8; --surface: #ffffff; --surface-2: #f8fafc; --hover: #f1f5f9;
        --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --border-strong: #cbd5e1;
        --primary: #0f766e; --primary-hover: #115e59; --primary-soft: #e6f4f2; --on-primary: #ffffff;
        --danger: #b91c1c; --danger-soft: #fdecec;
        --warning: #b45309; --warning-soft: #fef3e2;
        --success: #15803d; --success-soft: #e8f6ed;
        --info: #1d4ed8; --info-soft: #e8effd;
        --neutral-soft: #eef1f5;
        --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 16px rgba(15,23,42,.06);
        --shadow-lg: 0 20px 50px rgba(15,23,42,.18);
        --radius: 14px; --radius-sm: 10px;
        --sidebar: 252px; --tabbar: 64px;
        color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #0b1220; --surface: #111a2b; --surface-2: #0f1726; --hover: #17233a;
            --text: #e5edf7; --muted: #94a3b8; --border: #1e2a3d; --border-strong: #2c3b54;
            --primary: #2dd4bf; --primary-hover: #5eead4; --primary-soft: rgba(45,212,191,.12); --on-primary: #042f2e;
            --danger: #f87171; --danger-soft: rgba(248,113,113,.12);
            --warning: #fbbf24; --warning-soft: rgba(251,191,36,.12);
            --success: #4ade80; --success-soft: rgba(74,222,128,.12);
            --info: #60a5fa; --info-soft: rgba(96,165,250,.12);
            --neutral-soft: rgba(148,163,184,.12);
            --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
            --shadow-lg: 0 20px 50px rgba(0,0,0,.5);
            color-scheme: dark;
        }
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
        margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
        font: 15px/1.5 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4 { margin: 0; letter-spacing: -.015em; line-height: 1.25; }
    h1 { font-size: clamp(1.35rem, 2.6vw, 1.75rem); font-weight: 800; }
    h2 { font-size: 1.1rem; font-weight: 700; }
    h3 { font-size: 1rem; font-weight: 700; }
    a { color: var(--primary); }
    svg.icon { flex-shrink: 0; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* ---------- Boutons ---------- */
    .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        min-height: 42px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid transparent;
        background: var(--primary); color: var(--on-primary); font: inherit; font-weight: 600;
        cursor: pointer; text-decoration: none; white-space: nowrap;
        transition: background .15s ease, border-color .15s ease, transform .05s ease;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: .6; cursor: progress; }
    .btn-outline { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
    .btn-outline:hover { background: var(--hover); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { background: var(--hover); color: var(--text); }
    .btn-soft { background: var(--primary-soft); color: var(--primary); }
    .btn-soft:hover { background: var(--primary-soft); filter: brightness(.97); }
    .btn-danger { background: var(--danger-soft); color: var(--danger); }
    .btn-danger:hover { background: var(--danger-soft); filter: brightness(.96); }
    .btn-sm { min-height: 34px; padding: 0 12px; font-size: .875rem; border-radius: 9px; }
    .btn-block { width: 100%; }
    .icon-btn {
        display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px;
        border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer;
    }
    .icon-btn:hover { background: var(--hover); }

    /* ---------- Formulaires ---------- */
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field > label, .field-label { font-size: .85rem; font-weight: 600; color: var(--text); }
    .field .hint { font-size: .8rem; color: var(--muted); }
    .req::after { content: " *"; color: var(--danger); }
    input, select, textarea {
        width: 100%; min-height: 44px; padding: 10px 12px; border-radius: var(--radius-sm);
        border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font: inherit;
        transition: border-color .15s ease, box-shadow .15s ease;
    }
    textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-grid .span-2 { grid-column: 1 / -1; }
    .form-section { display: flex; flex-direction: column; gap: 14px; }
    .form-section + .form-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border); }
    .form-section-title { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .input-icon { position: relative; }
    .input-icon > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .input-icon > input { padding-left: 40px; }
    .input-action { position: relative; }
    .input-action > input { padding-right: 46px; }
    .input-action > button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .input-action > button:hover { background: var(--hover); color: var(--text); }
    .choice-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span {
        display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px;
        border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem;
    }
    .choice input:checked + span { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); }
    .choice input:focus-visible + span { outline: 2px solid var(--primary); outline-offset: 2px; }
    .form-error { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--danger-soft); color: var(--danger); font-size: .9rem; }

    /* ---------- Cartes / blocs ---------- */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .card-pad { padding: clamp(16px, 2.5vw, 22px); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px clamp(16px, 2.5vw, 22px); border-bottom: 1px solid var(--border); }
    .card-body { padding: clamp(16px, 2.5vw, 22px); }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
    .page-head p { margin: 4px 0 0; color: var(--muted); }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .toolbar .grow { flex: 1 1 240px; }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
    @media (max-width: 1100px) { .split { grid-template-columns: 1fr; } }

    /* KPI */
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .kpi { padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
    .kpi-icon { width: 44px; height: 44px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); flex-shrink: 0; }
    .kpi-label { font-size: .82rem; color: var(--muted); font-weight: 600; }
    .kpi-value { font-size: 1.45rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: .8rem; color: var(--muted); }
    @media (max-width: 640px) {
        .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .kpi { flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px; }
        .kpi-icon { width: 36px; height: 36px; border-radius: 10px; }
        .kpi-value { font-size: 1.2rem; }
    }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; white-space: nowrap; background: var(--neutral-soft); color: var(--muted); }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.plain::before { display: none; }
    .b-primary { background: var(--primary-soft); color: var(--primary); }
    .b-success { background: var(--success-soft); color: var(--success); }
    .b-warning { background: var(--warning-soft); color: var(--warning); }
    .b-danger { background: var(--danger-soft); color: var(--danger); }
    .b-info { background: var(--info-soft); color: var(--info); }

    /* Avatar */
    .avatar { width: 40px; height: 40px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); font-weight: 800; font-size: .85rem; flex-shrink: 0; }
    .avatar.lg { width: 64px; height: 64px; font-size: 1.25rem; }
    .person { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .person-name { font-weight: 700; }
    .person-sub { font-size: .83rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Filtres "pilules" */
    .segmented { display: inline-flex; padding: 4px; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; max-width: 100%; }
    .segmented button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; font-size: .88rem; padding: 7px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
    .segmented button:hover { color: var(--text); }
    .segmented button[aria-pressed="true"] { background: var(--primary-soft); color: var(--primary); }
    .count { font-size: .75rem; padding: 1px 7px; border-radius: 999px; background: var(--neutral-soft); color: var(--muted); font-variant-numeric: tabular-nums; }

    /* Tableau → cartes sur mobile */
    .table-wrap { overflow-x: auto; }
    table.data { width: 100%; border-collapse: collapse; }
    table.data th { text-align: left; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); white-space: nowrap; }
    table.data td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.data tbody tr { transition: background .1s ease; }
    table.data tbody tr:hover { background: var(--hover); }
    table.data tbody tr:last-child td { border-bottom: 0; }
    table.data tr.clickable { cursor: pointer; }
    @media (max-width: 760px) {
        table.data thead { display: none; }
        table.data, table.data tbody, table.data tr, table.data td { display: block; width: 100%; }
        table.data tr { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        table.data tbody tr:last-child { border-bottom: 0; }
        table.data td { padding: 4px 0; border: 0; display: flex; justify-content: space-between; gap: 12px; }
        table.data td[data-label]::before { content: attr(data-label); color: var(--muted); font-size: .85rem; }
        table.data td.cell-main { padding-bottom: 8px; }
        table.data td.cell-main::before { display: none; }
        table.data td:empty { display: none; }
    }

    /* Listes */
    .list { display: flex; flex-direction: column; }
    .list-item { display: flex; gap: 12px; align-items: center; padding: 12px clamp(16px, 2.5vw, 22px); border-bottom: 1px solid var(--border); }
    .list-item:last-child { border-bottom: 0; }
    .list-item .grow { flex: 1; min-width: 0; }
    .time-pill { font-variant-numeric: tabular-nums; font-weight: 800; font-size: .9rem; min-width: 56px; }

    /* États */
    .empty { text-align: center; padding: 36px 16px; color: var(--muted); }
    .empty svg { color: var(--border-strong); margin-bottom: 8px; }
    .empty strong { display: block; color: var(--text); margin-bottom: 4px; }
    .alert { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-sm); font-size: .92rem; }
    .alert.danger { background: var(--danger-soft); color: var(--danger); }
    .alert.info { background: var(--info-soft); color: var(--info); }
    .skeleton { position: relative; overflow: hidden; background: var(--neutral-soft); border-radius: 8px; color: transparent !important; }
    .skeleton::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: shimmer 1.2s infinite; }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    @media (prefers-reduced-motion: reduce) { .skeleton::after { animation: none; } * { scroll-behavior: auto !important; } }

    /* ---------- Fenêtres (dialog) ---------- */
    dialog.sheet {
        border: 0; padding: 0; border-radius: 18px; width: min(640px, calc(100% - 32px)); max-height: calc(100dvh - 48px);
        background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg);
    }
    dialog.sheet[open] { display: flex; flex-direction: column; animation: rise .18s ease-out; }
    dialog.sheet::backdrop { background: rgba(15,23,42,.5); backdrop-filter: blur(2px); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .sheet-head p { margin: 2px 0 0; font-size: .85rem; color: var(--muted); }
    .sheet-body { padding: 20px; overflow-y: auto; flex: 1; }
    .sheet-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface); }
    .sheet form { display: contents; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes rise { from { transform: translateY(12px); } to { transform: none; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
    @media (max-width: 640px) {
        dialog.sheet { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 20px 20px 0 0; max-height: 92dvh; }
        dialog.sheet[open] { animation: slideUp .22s ease-out; }
        .sheet-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
        .sheet-foot .btn { flex: 1; }
        .form-grid { grid-template-columns: 1fr; }
    }

    /* ---------- Notifications ---------- */
    .toasts { position: fixed; z-index: 100; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast { pointer-events: auto; display: flex; gap: 10px; align-items: center; min-width: 240px; max-width: min(420px, calc(100vw - 32px)); padding: 12px 14px; border-radius: 12px; background: var(--text); color: var(--bg); box-shadow: var(--shadow-lg); font-weight: 600; font-size: .92rem; animation: pop .2s ease-out; }
    .toast.error { background: var(--danger); color: #fff; }
    @media (max-width: 1023px) { .toasts { left: 16px; right: 16px; bottom: calc(var(--tabbar) + 12px + env(safe-area-inset-bottom, 0px)); } .toast { max-width: none; } }

    /* ---------- Graphiques ---------- */
    .chart { width: 100%; height: auto; display: block; }
    .chart .grid-line { stroke: var(--border); stroke-width: 1; }
    .chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin-top: 8px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
</style>
